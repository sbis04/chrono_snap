<!doctype html>
<!-- Dev-only: frames a ChronoSnap route at iPhone size. Not part of the production build.
     http://localhost:5173/dev/phone.html?src=/play/ABCD -->
<html>
<head>
<meta charset="utf-8" />
<title>Phone preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0807; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
  .phone { transform-origin: top center; margin-top: 8px; }
  .phone { width: 390px; height: 844px; border-radius: 48px; padding: 12px; background: #222; box-shadow: 0 0 0 2px #444, 0 30px 80px #000; }
  iframe { width: 390px; height: 820px; border: 0; border-radius: 38px; display: block; background: #120d0b; }
</style>
</head>
<body>
  <div class="phone"><iframe id="f" allow="vibrate"></iframe></div>
  <script>
  const fit = () => (document.querySelector(".phone").style.transform = `scale(${Math.min(1, (innerHeight - 16) / 868)})`);
  fit(); addEventListener("resize", fit);
  document.getElementById("f").src = new URLSearchParams(location.search).get("src") || "/";</script>
</body>
</html>
